default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: check-writing
        name: writing rules (no em dashes, banned words)
        entry: scripts/check-writing.sh
        language: script
        files: \.md$
      - id: strip-ai-trailers
        name: strip AI attribution trailers
        entry: scripts/strip-ai-trailers.sh
        language: script
        stages: [commit-msg]
