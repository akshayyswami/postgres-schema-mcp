name: Release

# Push a tag like v0.1.0 to start. Publishing steps wait for approval:
# create the `release` and `pypi` environments in the repository settings
# and add yourself as a required reviewer on each.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag matches the package version and is on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          server="$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
          test "$version" = "$package" || { echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $package"; exit 1; }
          test "$version" = "$server" || { echo "tag $GITHUB_REF_NAME does not match server.json version $server"; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Start the seeded Postgres
        run: make db
      - run: make check
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {found=0} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md entry for $version"; exit 1; }
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish-pypi:
    # Skipped unless the repository variable PUBLISH_TO_PYPI is set to true.
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
