# Every action in the workflows is pinned by commit SHA, so a new version needs a pull request.
# Dependabot opens them. After the first push, check the repo's Dependabot page on GitHub for
# config errors, and check that one of its pull requests changes both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
